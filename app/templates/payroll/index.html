{% extends "base.html" %}

{% block title %}Cálculo de Nómina{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 600px;">
    <div class="mb-4">
        <h1 class="page-title mb-1">
            <i class="bi bi-calculator-fill me-2 text-accent"></i>Calcular Nómina
        </h1>
        <p class="text-muted">Selecciona el empleado y el período para generar el reporte.</p>
    </div>

    <div class="glass-card p-4 p-md-5">
        <form method="GET" action="{{ url_for('payroll.report') }}" novalidate>

            <div class="mb-4">
                <label for="employee_id" class="form-label fw-medium">
                    <i class="bi bi-person me-2 text-accent"></i>Empleado
                </label>
                <select class="form-select glass-input" id="employee_id" name="employee_id" required>
                    <option value="">-- Selecciona un empleado --</option>
                    {% for emp in employees %}
                    <option value="{{ emp.id }}">{{ emp.name }} · CC {{ emp.document_id }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-6">
                    <label for="start_date" class="form-label fw-medium">
                        <i class="bi bi-calendar-event me-2 text-accent"></i>Fecha inicio
                    </label>
                    <input type="date" class="form-control glass-input"
                           id="start_date" name="start_date" required>
                </div>
                <div class="col-6">
                    <label for="end_date" class="form-label fw-medium">
                        <i class="bi bi-calendar-check me-2 text-accent"></i>Fecha fin
                    </label>
                    <input type="date" class="form-control glass-input"
                           id="end_date" name="end_date" required>
                </div>
            </div>

            <!-- Botones de período rápido -->
            <div class="mb-4">
                <p class="small text-muted mb-2">Período rápido:</p>
                <div class="d-flex gap-2 flex-wrap">
                    <button type="button" class="btn btn-sm btn-outline-secondary"
                            onclick="setPeriod('week')">Esta semana</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary"
                            onclick="setPeriod('month')">Este mes</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary"
                            onclick="setPeriod('lastMonth')">Mes anterior</button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary-glow w-100 py-3 fw-semibold">
                <i class="bi bi-file-earmark-text me-2"></i>Generar Reporte
            </button>
        </form>
    </div>
</div>

{% block extra_scripts %}
<script>
    function setPeriod(type) {
        const today = new Date();
        let start, end;

        if (type === 'week') {
            const dayOfWeek = today.getDay() || 7; // Lunes = 1
            start = new Date(today);
            start.setDate(today.getDate() - dayOfWeek + 1);
            end = today;
        } else if (type === 'month') {
            start = new Date(today.getFullYear(), today.getMonth(), 1);
            end = today;
        } else if (type === 'lastMonth') {
            start = new Date(today.getFullYear(), today.getMonth() - 1, 1);
            end = new Date(today.getFullYear(), today.getMonth(), 0);
        }

        document.getElementById('start_date').value = formatDate(start);
        document.getElementById('end_date').value = formatDate(end);
    }

    function formatDate(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    // Establecer mes actual por defecto
    setPeriod('month');
</script>
{% endblock %}
{% endblock %}
