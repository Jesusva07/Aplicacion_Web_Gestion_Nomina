[pytest]
# Configuración de pytest para la aplicación TurnosPro

# Directorio raíz de pruebas
testpaths = tests

# Patrones de archivos de prueba
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opciones de reporte
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes
    -ra

# Marcadores personalizados
markers =
    unit: Pruebas unitarias rápidas
    integration: Pruebas de integración
    slow: Pruebas que pueden tardar tiempo
    auth: Relacionadas con autenticación
    employee: Relacionadas con gestión de empleados
    payroll: Relacionadas con cálculo de nómina
    attendance: Relacionadas con asistencia

# Configuración de cobertura
[coverage:run]
branch = True
source = app
omit =
    */migrations/*
    */tests/*
    */__init__.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

precision = 2
skip_covered = False
skip_empty = True

[coverage:html]
directory = htmlcov
